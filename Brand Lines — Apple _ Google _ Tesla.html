<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Brand Lines — Apple / Google / Tesla</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --page: #f3f3f5;
            --shadow: 0 1px 1px rgba(0, 0, 0, .06), 0 22px 44px -20px rgba(0, 0, 0, .35);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --page: #0c0c0e;
                --shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 26px 50px -20px #000
            }
        }

        :root[data-theme="dark"] {
            --page: #0c0c0e;
            --shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 26px 50px -20px #000
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--page);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow-x: hidden
        }

        .row {
            min-height: 100vh;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
            padding: 32px 20px
        }

        .card {
            user-select: none;
            -webkit-user-select: none;
            position: relative;
            flex: 1 1 300px;
            max-width: 380px;
            aspect-ratio: 5/7;
            border-radius: 22px;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            box-shadow: var(--shadow);
            cursor: crosshair;
            opacity: 0;
            transform: translateY(28px) scale(.97);
            transition: opacity .9s cubic-bezier(.2, .7, .2, 1) var(--d), transform 1.1s cubic-bezier(.2, .7, .2, 1) var(--d)
        }

        .card.in {
            opacity: 1;
            transform: none
        }

        .card canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block
        }

        .card::before,
        .card::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            pointer-events: none
        }

        .card::before {
            top: 0;
            height: 84px;
            background: linear-gradient(var(--bg), transparent)
        }

        .card::after {
            bottom: 0;
            height: 32%;
            background: linear-gradient(transparent, var(--bg) 72%)
        }

        .hd {
            position: absolute;
            z-index: 1;
            left: 24px;
            top: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 20px
        }

        .hd i {
            width: 20px
        }

        .hd b {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -.012em
        }

        .ft {
            position: absolute;
            z-index: 1;
            left: 24px;
            right: 24px;
            bottom: 24px
        }

        .ft h2 {
            margin: 0 0 16px;
            max-width: 11em;
            font-weight: 700;
            font-size: clamp(24px, 2vw + 10px, 31px);
            line-height: 1.07;
            letter-spacing: -.04em;
            text-wrap: balance
        }

        .cta {
            font: 500 12.5px/1 Inter, ui-sans-serif, system-ui, sans-serif;
            letter-spacing: .005em;
            background: none;
            border: 0;
            padding: 0;
            color: color-mix(in srgb, var(--fg) 78%, transparent);
            cursor: pointer;
            display: inline-flex;
            gap: 6px;
            align-items: center
        }

        .cta span {
            display: inline-block;
            transition: transform .3s cubic-bezier(.2, .7, .2, 1)
        }

        .cta:hover span {
            transform: translateX(4px)
        }

        .rev {
            opacity: 0;
            transform: translateY(12px);
            filter: blur(5px);
            transition: opacity .8s cubic-bezier(.2, .7, .2, 1) calc(var(--d) + var(--r)), transform .9s cubic-bezier(.2, .7, .2, 1) calc(var(--d) + var(--r)), filter .8s ease calc(var(--d) + var(--r))
        }

        .in .rev {
            opacity: 1;
            transform: none;
            filter: none
        }
    </style>
</head>

<body>
    <main class="row" id="row"></main>
    <script>
        (() => {
            const CELL = 5, SEG = 8, GAP = 1.8, TIERS = [.08, .26, .48, .72], ALPHA = [.3, .5, .76, 1];
            const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
            const cl = v => v < 0 ? 0 : v > 1 ? 1 : v, eo = v => 1 - Math.pow(1 - v, 3);
            const LOGOS = {
                apple: { d: "M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701" },
                google: { d: "M18.13 6.86A8 8 0 1 0 20 12H12.5", stroke: 4.6 },
                tesla: { d: "M2 6.2C7 2.6 17 2.6 22 6.2L21 7.4C16.5 5 7.5 5 3 7.4ZM7.2 8.7C9.6 7.5 14.4 7.5 16.8 8.7L16.2 9.7C14.2 8.9 9.8 8.9 7.8 9.7ZM10.6 9.2H13.4V21.6L12 23.6L10.6 21.6Z" }
            };
            const BRANDS = [
                { id: 'apple', name: 'Apple', tag: 'Simplicity, engineered.', bg: '#e3e3e7', line: '#111113', fg: '#111113', box: '#0a6cff', acc: '#0038b8' },
                { id: 'google', name: 'Google', tag: 'Organize the world’s information.', bg: '#1a62e8', line: '#c4deff', fg: '#ffffff', box: '#04124a', acc: '#ffffff' },
                { id: 'tesla', name: 'Tesla', tag: 'Accelerating sustainable energy.', bg: '#070707', line: '#e8213a', fg: '#ffffff', box: '#2f8bff', acc: '#6df2ff' }
            ];
            const row = document.getElementById('row');
            row.innerHTML = BRANDS.map((b, i) => `<article class="card" style="--bg:${b.bg};--fg:${b.fg};--d:${(i * .18 + .12).toFixed(2)}s"><canvas></canvas><div class="hd rev" style="--r:.45s"><i></i><b>${b.name}</b></div><div class="ft"><h2 class="rev" style="--r:.55s">${b.tag}</h2><button class="cta rev" style="--r:.7s">Reveal the source <span>→</span></button></div></article>`).join('');

            const nz = (x, y, t) => (Math.sin(y * .03 - t * .0009 + x * .04) + Math.sin(y * .017 - t * .0006 - x * .025 + 2)) * .5;
            const B = (S, x, y) => { const c = (x / CELL) | 0, r = (y / CELL) | 0; return c < 0 || r < 0 || c >= S.cols || r >= S.rows ? 0 : S.tab[r * S.cols + c] };
            const avg = (S, x, y, r) => { let s = 0; for (let a = -1; a <= 1; a++)for (let c = -1; c <= 1; c++)s += B(S, x + a * r, y + c * r); return s / 9 };

            function setup(S, w, h) {
                const dpr = Math.max(1, window.devicePixelRatio || 1);
                S.w = w; S.h = h; S.dpr = dpr; S.cv.width = Math.round(w * dpr); S.cv.height = Math.round(h * dpr);
                S.ctx = S.cv.getContext('2d');
                const cols = Math.ceil(w / CELL), rows = Math.ceil(h / CELL), side = Math.min(w * .74, h * .5);
                Object.assign(S, { cols, rows, side, lx: (w - side) / 2, ly: h * .44 - side / 2 });
                // 1) draw logo path once on a throw-away offscreen canvas, store brightness per cell, then drop the canvas
                const tab = new Float32Array(cols * rows);
                {
                    const o = document.createElement('canvas'); o.width = cols; o.height = rows;
                    const c = o.getContext('2d', { willReadFrequently: true }), L = LOGOS[S.b.id];
                    c.scale(1 / CELL, 1 / CELL); c.translate(S.lx, S.ly); c.scale(side / 24, side / 24);
                    if (L.stroke) { c.lineWidth = L.stroke; c.stroke(S.path) } else c.fill(S.path);
                    const d = c.getImageData(0, 0, cols, rows).data;
                    for (let i = 0; i < tab.length; i++)tab[i] = d[i * 4 + 3] / 255;
                }
                S.tab = tab;
                const N = Math.round(w / 8), M = Math.ceil(h / SEG), n = N * M;
                Object.assign(S, { N, M, sp: w / N, ox: new Float32Array(n), oy: new Float32Array(n), vx: new Float32Array(n), vy: new Float32Array(n) });
            }

            function drawIcon(S, el) {
                const { ctx, b } = S, ix = 24, iy = 22, n = 10, rr = S.side / n / 3;
                ctx.globalAlpha = eo(cl((el - 300) / 700)); ctx.fillStyle = b.fg;
                for (let i = 0; i < n; i++)for (let j = 0; j < 10; j++) {
                    const v = avg(S, S.lx + (i + .5) / n * S.side, S.ly + (j + .5) / 10 * S.side, rr);
                    if (v < .25) continue;
                    const wd = v < .5 ? .55 : v < .78 ? .95 : 1.45;
                    ctx.fillRect(ix + (i + .5) * 2 - wd / 2, iy + j * 2, wd, 1.6);
                }
                ctx.globalAlpha = 1;
            }

            function draw(S, now) {
                const ctx = S.ctx; if (!ctx) return;
                const { w, h, N, M, sp, b, ox, oy, vx, vy } = S;
                ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0); ctx.clearRect(0, 0, w, h);
                if (S.t0 == null) return;
                const el = RM ? 1e5 : now - S.t0; if (el < 0) return;
                const tt = RM ? 0 : now, live = S.inside, R = 86;

                const P = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
                for (let i = 0; i < N; i++) {
                    const x = (i + .5) * sp, vis = h * eo(cl((el - i * 14) / 1100));
                    for (let j = 0; j < M; j++) {
                        const k = i * M + j, y = j * SEG;
                        if (live) { // scatter away from the cursor
                            const dx = x - S.mx, dy = y + SEG / 2 - S.my, d = Math.hypot(dx, dy);
                            if (d < R) { const f = Math.pow(1 - d / R, 2) * 2.1 / (d || 1); vx[k] += dx * f; vy[k] += dy * f * .5 }
                        }
                        // spring back to rest
                        vx[k] = (vx[k] - ox[k] * .06) * .86; vy[k] = (vy[k] - oy[k] * .06) * .86; ox[k] += vx[k]; oy[k] += vy[k];
                        if (y > vis) continue;
                        // brightness table + slowly downward-flowing noise -> one of 4 width tiers
                        const v = B(S, x, y + SEG / 2) * .85 + .12 + nz(x, y, tt) * .22;
                        const t = v < .22 ? 0 : v < .46 ? 1 : v < .72 ? 2 : 3, wd = sp * TIERS[t];
                        P[t].rect(x + nz(x * .7, y, tt + 3e3) * 1.5 + ox[k] - wd / 2, y + oy[k], wd, SEG - GAP);
                    }
                }
                ctx.fillStyle = b.line;
                for (let t = 0; t < 4; t++) { ctx.globalAlpha = ALPHA[t]; ctx.fill(P[t]) }
                ctx.globalAlpha = 1;
                drawIcon(S, el);
            }

            const cards = [...document.querySelectorAll('.card')].map((el, i) => {
                const b = BRANDS[i], S = { el, b, cv: el.querySelector('canvas'), mx: -1e3, my: -1e3, inside: false, pin: false, hv: 0, t0: null, delay: RM ? 0 : i * 180 + 120, path: new Path2D(LOGOS[b.id].d) };
                const pos = e => { const r = el.getBoundingClientRect(); S.mx = e.clientX - r.left; S.my = e.clientY - r.top; S.inside = true };
                el.addEventListener('pointermove', pos); el.addEventListener('pointerdown', pos);
                el.addEventListener('pointerleave', () => S.inside = false);
                new ResizeObserver(([e]) => { const r = e.contentRect; if (r.width && r.height) setup(S, r.width, r.height) }).observe(el);
                return S;
            });

            let go = false;
            const start = () => {
                if (go) return; go = true; const n = performance.now();
                cards.forEach(S => { S.t0 = n + S.delay; setTimeout(() => S.el.classList.add('in'), S.delay) });
            };
            const fonts = document.fonts ? Promise.all([document.fonts.load('500 12px Inter'), document.fonts.load('700 20px Inter')]) : Promise.resolve();
            Promise.race([fonts, new Promise(r => setTimeout(r, 1500))]).then(start, start);

            const frame = n => { cards.forEach(S => draw(S, n)); requestAnimationFrame(frame) };
            requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
