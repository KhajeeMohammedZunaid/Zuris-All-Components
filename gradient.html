<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Gradient</title>
<style>
  html, body { margin: 0; height: 100%; background: #fafafa; }

  .hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    background: #0640c8;           /* fallback until the canvas paints */
  }

  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>

<section class="hero" id="hero"><canvas id="bg"></canvas></section>

<a href="gradient-light.html" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(255,255,255,0.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.2);border-radius:9999px;padding:8px 18px;color:#ffffff;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,0.3);transition:all 0.2s ease;">Switch to Light Version &rarr;</a>

<script>
  /*
    One continuous gradient, painted per pixel (no ellipses, so there are no
    shape ends, rims or seams anywhere).

    Every pixel gets a "vertical position" that is shifted slightly by how far
    it is from the centre line:
        t = y/height + CURVE * (x - centre)^2
    so every band bows downward in the middle and rises smoothly toward the
    sides, all the way to the screen edges.

    colour = blue->white ramp sampled at t, then blended toward black by a
    smooth falloff that uses the same idea.
  */

  // ---------- settings you can tweak ----------
  var BLACK = [3, 10, 30];     // darkest colour (r,g,b)
  var CURVE = 0.20;            // band curve: 0 = flat, bigger = more bowed
  var BLACK_CURVE = 0.34;      // how much the black rises at the sides
  var BLACK_REACH = 0.56;      // how far down the black reaches (0..1 of height)
  var BLACK_SOLID = 0.03;      // portion that stays fully black
  var STOPS = [                // [position 0..1, hex]
    [0.00, "#0a34b0"], [0.40, "#0640c8"], [0.53, "#0a50e8"], [0.60, "#1f66ee"],
    [0.69, "#6f9cf5"], [0.77, "#b8cffa"], [0.84, "#e6eefc"], [0.90, "#f7f9fe"],
    [0.97, "#fafafa"], [1.00, "#fafafa"]
  ];
  // --------------------------------------------

  var canvas = document.getElementById("bg");
  var ctx = canvas.getContext("2d");

  function hex(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }

  function sstep(a, b, x) {                       // smootherstep, zero slope at both ends
    var t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * t * (t * (t * 6 - 15) + 10);
  }

  // Smooth colour ramp lookup table (linear samples, then blurred to round every kink)
  var N = 1024, LUT = (function () {
    var s = [], i, j, k, c;
    for (i = 0; i < N; i++) {
      var t = i / (N - 1); j = 0;
      while (j < STOPS.length - 2 && t > STOPS[j + 1][0]) j++;
      var a = STOPS[j], b = STOPS[j + 1], f = (t - a[0]) / (b[0] - a[0]);
      var ca = hex(a[1]), cb = hex(b[1]);
      s.push([0, 1, 2].map(function (n) { return ca[n] + (cb[n] - ca[n]) * f; }));
    }
    for (var pass = 0; pass < 3; pass++) {
      var nx = [];
      for (i = 0; i < N; i++) {
        var sum = [0, 0, 0], cnt = 0;
        for (k = -24; k <= 24; k++) {
          var idx = Math.min(N - 1, Math.max(0, i + k));
          for (c = 0; c < 3; c++) sum[c] += s[idx][c];
          cnt++;
        }
        nx.push([sum[0] / cnt, sum[1] / cnt, sum[2] / cnt]);
      }
      s = nx;
    }
    return s;
  })();

  function paint() {
    var w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
    canvas.width = w; canvas.height = h;
    var img = ctx.createImageData(w, h), d = img.data;

    // per-column curve term (x distance from centre, squared)
    var u2 = new Float32Array(w);
    for (var x = 0; x < w; x++) { var u = x / w - 0.5; u2[x] = u * u; }

    for (var y = 0; y < h; y++) {
      var ty = y / h, row = y * w * 4;
      for (var xx = 0; xx < w; xx++) {
        var tb = ty + CURVE * u2[xx];                       // blue->white position
        var li = tb <= 0 ? 0 : tb >= 1 ? N - 1 : tb * (N - 1);
        var i0 = li | 0, i1 = Math.min(N - 1, i0 + 1), fr = li - i0;
        var c0 = LUT[i0], c1 = LUT[i1];

        var td = ty + BLACK_CURVE * u2[xx];                 // black falloff position
        var a = 1 - sstep(BLACK_SOLID, BLACK_REACH, td);

        var n = (Math.random() - 0.5);                      // dither: removes banding
        var r = c0[0] + (c1[0] - c0[0]) * fr;
        var g = c0[1] + (c1[1] - c0[1]) * fr;
        var b = c0[2] + (c1[2] - c0[2]) * fr;
        var p = row + xx * 4;
        d[p]     = r + (BLACK[0] - r) * a + n;
        d[p + 1] = g + (BLACK[1] - g) * a + n;
        d[p + 2] = b + (BLACK[2] - b) * a + n;
        d[p + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  paint();
  var timer;
  window.addEventListener("resize", function () {
    clearTimeout(timer);
    timer = setTimeout(paint, 120);
  });
</script>
</body>
</html>
