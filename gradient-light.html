<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Gradient — Light Mode</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    background: #1d68f2; /* fallback until the canvas paints */
  }

  .hero canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Minimal floating preset switcher */
  .preset-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 9999px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.04);
    font-size: 13px;
    font-weight: 500;
  }

  .preset-btn {
    padding: 6px 14px;
    border-radius: 9999px;
    border: none;
    background: transparent;
    color: #4b5563;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    font-size: 13px;
  }

  .preset-btn:hover {
    color: #0f172a;
    background: rgba(0, 0, 0, 0.04);
  }

  .preset-btn.active {
    background: #ffffff;
    color: #0f172a;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    font-weight: 600;
  }

  .divider {
    width: 1px;
    height: 16px;
    background: rgba(0, 0, 0, 0.12);
    margin: 0 4px;
  }

  .link-btn {
    padding: 6px 14px;
    border-radius: 9999px;
    text-decoration: none;
    color: #1d4ed8;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .link-btn:hover {
    background: rgba(29, 78, 216, 0.08);
  }
</style>
</head>
<body>

<section class="hero" id="hero"><canvas id="bg"></canvas></section>

<!-- Floating preset selector and switch back to dark -->
<div class="preset-bar">
  <button class="preset-btn active" onclick="setPreset('daylight')">Daylight Azure</button>
  <button class="preset-btn" onclick="setPreset('sky')">Soft Sky</button>
  <button class="preset-btn" onclick="setPreset('cerulean')">Cerulean Breeze</button>
  <span class="divider"></span>
  <a href="gradient.html" class="link-btn">Dark Version &rarr;</a>
</div>

<script>
  /*
    Hero Gradient — Light Mode
    Continuous bowed curved gradient rendered per-pixel on canvas with 0 banding.
  */

  var PRESETS = {
    // 1. Daylight Azure: The direct radiant light counterpart to the original dark hero
    daylight: {
      TOP_COLOR: [12, 70, 204],    // saturated royal azure anchor (pure vibrant blue, no dark murkiness)
      CURVE: 0.18,                 // band curve: downward bow in center
      TOP_CURVE: 0.26,             // top color rise at sides
      TOP_REACH: 0.36,             // how far down the top tone anchors (0..1)
      TOP_SOLID: 0.00,             // smooth falloff starts immediately
      STOPS: [
        [0.00, "#1058e4"],
        [0.22, "#1d68f2"],
        [0.40, "#3680f7"],
        [0.54, "#5a98fa"],
        [0.66, "#84b4fc"],
        [0.77, "#b5d4fd"],
        [0.86, "#deecfe"],
        [0.93, "#f2f7ff"],
        [0.98, "#ffffff"],
        [1.00, "#ffffff"]
      ]
    },

    // 2. Soft Sky: Gentle, airy, minimalist daylight gradient
    sky: {
      TOP_COLOR: [35, 105, 225],
      CURVE: 0.16,
      TOP_CURVE: 0.22,
      TOP_REACH: 0.28,
      TOP_SOLID: 0.00,
      STOPS: [
        [0.00, "#3b82f6"],
        [0.24, "#60a5fa"],
        [0.44, "#93c5fd"],
        [0.62, "#bfdbfe"],
        [0.76, "#dbeafe"],
        [0.87, "#eff6ff"],
        [0.95, "#f8faff"],
        [1.00, "#ffffff"]
      ]
    },

    // 3. Cerulean Breeze: Electric cyan-azure modern tech gradient
    cerulean: {
      TOP_COLOR: [2, 115, 195],
      CURVE: 0.20,
      TOP_CURVE: 0.28,
      TOP_REACH: 0.32,
      TOP_SOLID: 0.00,
      STOPS: [
        [0.00, "#0284c7"],
        [0.22, "#0ea5e9"],
        [0.42, "#38bdf8"],
        [0.58, "#7dd3fc"],
        [0.72, "#bae6fd"],
        [0.84, "#e0f2fe"],
        [0.92, "#f0f9ff"],
        [0.98, "#ffffff"],
        [1.00, "#ffffff"]
      ]
    }
  };

  var currentKey = 'daylight';
  var currentPreset = PRESETS.daylight;

  var canvas = document.getElementById("bg");
  var ctx = canvas.getContext("2d");

  function hex(h) {
    return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); });
  }

  function sstep(a, b, x) {
    var t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * t * (t * (t * 6 - 15) + 10);
  }

  var N = 1024;
  var LUT = [];

  function buildLUT(stops) {
    var s = [], i, j, k, c;
    for (i = 0; i < N; i++) {
      var t = i / (N - 1); j = 0;
      while (j < stops.length - 2 && t > stops[j + 1][0]) j++;
      var a = stops[j], b = stops[j + 1], f = (t - a[0]) / (b[0] - a[0]);
      var ca = hex(a[1]), cb = hex(b[1]);
      s.push([0, 1, 2].map(function (n) { return ca[n] + (cb[n] - ca[n]) * f; }));
    }
    // 3-pass gaussian blur over lookup table to guarantee zero kinks/banding
    for (var pass = 0; pass < 3; pass++) {
      var nx = [];
      for (i = 0; i < N; i++) {
        var sum = [0, 0, 0], cnt = 0;
        for (k = -24; k <= 24; k++) {
          var idx = Math.min(N - 1, Math.max(0, i + k));
          for (c = 0; c < 3; c++) sum[c] += s[idx][c];
          cnt++;
        }
        nx.push([sum[0] / cnt, sum[1] / cnt, sum[2] / cnt]);
      }
      s = nx;
    }
    return s;
  }

  LUT = buildLUT(currentPreset.STOPS);

  function paint() {
    var w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
    canvas.width = w; canvas.height = h;
    var img = ctx.createImageData(w, h), d = img.data;

    var u2 = new Float32Array(w);
    for (var x = 0; x < w; x++) { var u = x / w - 0.5; u2[x] = u * u; }

    var topColor = currentPreset.TOP_COLOR;
    var curve = currentPreset.CURVE;
    var topCurve = currentPreset.TOP_CURVE;
    var topReach = currentPreset.TOP_REACH;
    var topSolid = currentPreset.TOP_SOLID;

    for (var y = 0; y < h; y++) {
      var ty = y / h, row = y * w * 4;
      for (var xx = 0; xx < w; xx++) {
        var tb = ty + curve * u2[xx];
        var li = tb <= 0 ? 0 : tb >= 1 ? N - 1 : tb * (N - 1);
        var i0 = li | 0, i1 = Math.min(N - 1, i0 + 1), fr = li - i0;
        var c0 = LUT[i0], c1 = LUT[i1];

        var td = ty + topCurve * u2[xx];
        var a = 1 - sstep(topSolid, topReach, td);

        var n = (Math.random() - 0.5); // anti-banding dither
        var r = c0[0] + (c1[0] - c0[0]) * fr;
        var g = c0[1] + (c1[1] - c0[1]) * fr;
        var b = c0[2] + (c1[2] - c0[2]) * fr;
        var p = row + xx * 4;
        d[p]     = r + (topColor[0] - r) * a + n;
        d[p + 1] = g + (topColor[1] - g) * a + n;
        d[p + 2] = b + (topColor[2] - b) * a + n;
        d[p + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function setPreset(key) {
    if (!PRESETS[key]) return;
    currentKey = key;
    currentPreset = PRESETS[key];
    LUT = buildLUT(currentPreset.STOPS);

    // Update active button state
    var buttons = document.querySelectorAll('.preset-btn');
    buttons.forEach(function (btn) {
      if (btn.getAttribute('onclick').indexOf(key) !== -1) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    paint();
  }

  paint();
  var timer;
  window.addEventListener("resize", function () {
    clearTimeout(timer);
    timer = setTimeout(paint, 120);
  });
</script>
</body>
</html>
